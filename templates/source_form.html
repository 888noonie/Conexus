{% extends "base.html" %}
{% block title %}New source monitor — Conexus{% endblock %}
{% block content %}
<h1>New source monitor</h1>
<form method="post">
  {% csrf_token %}
  {% for field in form %}
  <div class="field">
    <label for="{{ field.id_for_label }}">{{ field.label }}</label>
    {{ field }}
  </div>
  {% endfor %}
  <button type="submit" class="btn">Create monitor</button>
</form>
{% endblock %}
