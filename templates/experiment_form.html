{% extends "base.html" %}
{% block title %}Start experiment — Conexus{% endblock %}
{% block content %}
<h1>Start experiment</h1>
<p class="meta">For: {{ opportunity.title }}</p>
<form method="post">
  {% csrf_token %}
  {% for field in form %}
  <div class="field">
    <label for="{{ field.id_for_label }}">{{ field.label }}</label>
    {{ field }}
  </div>
  {% endfor %}
  <button type="submit" class="btn">Start experiment</button>
</form>
{% endblock %}
