{% extends "base.html" %}
{% block title %}Record outcome — Conexus{% endblock %}
{% block content %}
<h1>Record outcome</h1>
<p class="meta">{{ experiment.hypothesis }}</p>
<form method="post">
  {% csrf_token %}
  {% for field in form %}
  <div class="field">
    <label for="{{ field.id_for_label }}">{{ field.label }}</label>
    {{ field }}
  </div>
  {% endfor %}
  <button type="submit" class="btn">Record outcome</button>
</form>
{% endblock %}
